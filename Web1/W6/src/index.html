<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=500, initial-scale=1" />

    <!-- Change this to your name-->
    <meta name="author" content="Name" />

    <title>WEB222 Music App</title>
    <!-- Classless CSS Stylesheet - https://watercss.kognise.dev/ -->
    <link rel="stylesheet" href="./css/water.css" />
  </head>
  <nav id="menu">
    <!-- Dynamically create your menu category buttons here -->
    <a href="request.html">Request a New Artist</a>
  </nav>
  <br />
  <body>
    <header>
      <!-- Change this to your App's info -->
      <h1>Pop Subgenres</h1>
      <p>A mash up of Pop, Art Pop, Pop Rock with different artists from different generations</p>
    </header>

    <nav id="menu">
      <!-- Dynamically create your menu category buttons here -->
    </nav>

    <hr />

    <main>
      <h2 id="selected-artist">
        <!-- Dynamically update the selected category title -->
      </h2>
      <div id="cards-container">
        <!-- Cards will be created dynamically here -->
      </div>

      <thead>
        <!-- Statically create the headings for your table here -->
      </thead>
      <tbody id="songs">
        <!-- Dynamically create your product rows here -->
      </tbody>
    </main>

    <!-- JavaScript Data Files -->
    <script src="./js/artists.js"></script>
    <script src="./js/songs.js"></script>

    <!-- Main App JavaScript File -->
    <script src="./js/app.js"></script>
  </body>
  <footer>
    <form action="https://httpbin.org/post" method="post" id="newsletter-form">
      <label for="email">Sign up for our newsletter</label>
      <hr />
      <input type="email" id="email" name="email" placeholder="Enter your email" required />
      <button type="submit">Subscribe</button>
    </form>
  </footer>
</html>
